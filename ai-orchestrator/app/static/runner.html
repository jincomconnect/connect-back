<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Runner</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --ink: #1f2933;
      --muted: #52606d;
      --line: #d9e2ec;
      --accent: #0f766e;
      --accent-2: #0ea5e9;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top right, #d8f3dc 0%, #f5f7fa 42%);
      color: var(--ink);
    }

    .wrap {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px 32px;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 6px 14px rgba(31, 41, 51, 0.05);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.2px;
    }

    .sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    @media (max-width: 840px) {
      .grid.two { grid-template-columns: 1fr; }
    }

    label {
      font-size: 13px;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.35;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
    }

    button.secondary {
      background: #334e68;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }

    .status.error { color: var(--danger); font-weight: 600; }
    .status.ok { color: #0f766e; font-weight: 600; }

    pre {
      margin: 0;
      padding: 14px;
      background: #0b1220;
      color: #dbeafe;
      border-radius: 10px;
      font-size: 12px;
      overflow: auto;
      max-height: 420px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ecfeff;
      border: 1px solid #a5f3fc;
      color: #0e7490;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      margin-top: 10px;
    }

    .sandbox-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding: 10px 14px;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 10px;
      font-size: 13px;
      color: #92400e;
      cursor: pointer;
      user-select: none;
    }

    .sandbox-toggle input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #d97706;
      flex-shrink: 0;
    }

    .sandbox-banner {
      display: none;
      background: #fffbeb;
      border: 1px solid #fbbf24;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #92400e;
      font-weight: 600;
      margin-top: 10px;
    }

    .sandbox-banner.visible { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>Agent Runner</h1>
      <p class="sub">Run the 4-agent pipeline for backend or frontend targets.</p>
      <div class="pill">Local mode: auth disabled for /orchestrate</div>
    </section>

    <section class="card">
      <h2 style="margin-top:0">1) Connection</h2>
      <div class="grid two">
        <div>
          <label for="orchestratorBase">Orchestrator Base URL</label>
          <input id="orchestratorBase" value="http://localhost:9000" />
        </div>
        <div>
          <label for="apiKey">Anthropic API Key</label>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="apiKey" type="password" placeholder="sk-ant-... (never stored, sent per-request)" autocomplete="off" style="flex:1" />
            <button id="testKeyBtn" class="secondary" style="white-space:nowrap;flex-shrink:0">Test Key</button>
          </div>
          <div id="keyStatus" class="status"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 style="margin-top:0">2) Run Pipeline</h2>
      <div class="grid two">
        <div>
          <label for="repoTarget">Target Repository</label>
          <select id="repoTarget">
            <option value="backend">Backend repository</option>
            <option value="frontend">Frontend repository</option>
          </select>
        </div>
        <div>
          <label for="taskId">Task ID (optional)</label>
          <input id="taskId" placeholder="FEAT-123" />
        </div>
      </div>

      <div style="margin-top:10px">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" placeholder="Describe the feature request in detail."></textarea>
      </div>

      <div style="margin-top:10px">
        <label for="context">Product Context (optional but recommended)</label>
        <textarea id="context" placeholder="Paste architecture notes, coding standards, and relevant snippets."></textarea>
      </div>

      <div class="actions">
        <button id="runBtn">Run Agents</button>
      </div>
      <label class="sandbox-toggle" for="sandboxMode">
        <input type="checkbox" id="sandboxMode" />
        <span><strong>Sandbox / Dry-run mode</strong> — explain what each agent would do without calling Claude</span>
      </label>
      <div id="sandboxBanner" class="sandbox-banner">Sandbox mode is ON. No Claude API calls will be made.</div>
      <div id="runStatus" class="status"></div>
    </section>

    <section class="card">
      <h2 style="margin-top:0">3) Output</h2>
      <pre id="result">No result yet.</pre>
    </section>
  </div>

  <script>
    const els = {
      orchestratorBase: document.getElementById("orchestratorBase"),
      apiKey: document.getElementById("apiKey"),
      testKeyBtn: document.getElementById("testKeyBtn"),
      keyStatus: document.getElementById("keyStatus"),
      repoTarget: document.getElementById("repoTarget"),
      taskId: document.getElementById("taskId"),
      prompt: document.getElementById("prompt"),
      context: document.getElementById("context"),
      sandboxMode: document.getElementById("sandboxMode"),
      sandboxBanner: document.getElementById("sandboxBanner"),
      runBtn: document.getElementById("runBtn"),
      runStatus: document.getElementById("runStatus"),
      result: document.getElementById("result"),
    };

    function setStatus(node, message, type) {
      node.textContent = message || "";
      node.className = "status" + (type ? " " + type : "");
    }

    function toJson(value) {
      return JSON.stringify(value, null, 2);
    }

    function buildContext(baseContext, target) {
      const targetLine = target === "frontend"
        ? "Target repository: frontend. Generate API and integration plan suitable for frontend consumption."
        : "Target repository: backend. Focus on server-side implementation details and tests.";
      return [targetLine, baseContext || ""].filter(Boolean).join("\n\n");
    }

    async function runAgents() {
      const prompt = els.prompt.value.trim();
      if (!prompt) {
        setStatus(els.runStatus, "Prompt is required.", "error");
        return;
      }

      const base = els.orchestratorBase.value.trim().replace(/\/$/, "");
      const target = els.repoTarget.value;
      const taskId = els.taskId.value.trim();
      const productContext = buildContext(els.context.value.trim(), target);

      const body = {
        prompt,
        product_context: productContext,
        sandbox: els.sandboxMode.checked,
      };
      if (taskId) body.task_id = taskId;
      const apiKey = els.apiKey.value.trim();
      if (apiKey) body.api_key = apiKey;

      const modeLabel = els.sandboxMode.checked ? "sandbox dry-run" : "4-agent workflow";
      setStatus(els.runStatus, `Running ${modeLabel}...`, "");
      els.result.textContent = "Waiting for response...";
      els.runBtn.disabled = true;

      try {
        const response = await fetch(base + "/orchestrate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error((data && (data.detail || data.message)) || "Orchestrator request failed");
        }

        els.result.textContent = toJson(data);
        setStatus(els.runStatus, "Run complete.", "ok");
      } catch (error) {
        els.result.textContent = String(error && error.stack ? error.stack : error);
        setStatus(els.runStatus, error.message || "Run failed", "error");
      } finally {
        els.runBtn.disabled = false;
      }
    }

    els.runBtn.addEventListener("click", runAgents);

    els.sandboxMode.addEventListener("change", () => {
      els.sandboxBanner.classList.toggle("visible", els.sandboxMode.checked);
      els.runBtn.textContent = els.sandboxMode.checked ? "Run Sandbox" : "Run Agents";
    });

    els.testKeyBtn.addEventListener("click", async () => {
      const key = els.apiKey.value.trim();
      if (!key) {
        setStatus(els.keyStatus, "Enter an API key first.", "error");
        return;
      }
      const base = els.orchestratorBase.value.trim().replace(/\/$/, "");
      els.testKeyBtn.disabled = true;
      setStatus(els.keyStatus, "Validating...", "");
      try {
        const r = await fetch(base + "/validate-key", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ api_key: key }),
        });
        const data = await r.json().catch(() => ({}));
        if (data.valid) {
          setStatus(els.keyStatus, "\u2713 " + data.message, "ok");
        } else {
          setStatus(els.keyStatus, "\u2717 " + (data.message || "Key invalid"), "error");
        }
      } catch (err) {
        setStatus(els.keyStatus, "Request failed: " + err.message, "error");
      } finally {
        els.testKeyBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
